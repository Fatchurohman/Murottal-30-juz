<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murottal 30 Juz - Masjid Al-Ma'hamah, PCGP</title>
  
  <!-- Font Arab & Font Latin Modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Tema Cerah & Elegan */
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Aksen Emas & Sorotan Kata */
      --gold-primary: #b45309;
      --active-word-bg: rgba(245, 158, 11, 0.22);
      --active-word-border: #d97706;
      --active-ayah-bg: #fffbeb;
      --active-ayah-border: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 1.5rem 1rem 7.5rem;
      display: flex;
      justify-content: center;
    }

    .mushaf-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header Brand */
    .app-header {
      text-align: center;
      padding: 1rem 0 0.5rem;
    }

    /* Efek Teks Gold Glorious 3D */
    .gold-3d-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffe082 0%, #d4af37 35%, #aa7c11 70%, #5d4002 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 1px rgba(255, 255, 255, 0.8))
              drop-shadow(0 3px 2px rgba(180, 83, 9, 0.45))
              drop-shadow(0 6px 6px rgba(0, 0, 0, 0.15));
      margin-bottom: 0.35rem;
    }

    .sub-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #92400e;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(254, 243, 199, 0.7);
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }

    /* Panel Pilihan Surah & Qari */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      position: sticky;
      top: 1rem;
      z-index: 50;
      box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 600px) {
      .controls-panel {
        grid-template-columns: 1fr;
      }
      .gold-3d-title {
        font-size: 1.8rem;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group select {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .form-group select:focus {
      border-color: #d97706;
      background: #ffffff;
    }

    /* Kartu Ayat */
    .ayah-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.4rem 1.6rem;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.04);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .ayah-card.active-ayah {
      border-color: var(--active-ayah-border);
      background-color: var(--active-ayah-bg);
      box-shadow: 0 4px 20px -2px rgba(245, 158, 11, 0.2);
    }

    .ayah-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .ayah-badge {
      background: #e2e8f0;
      color: #334155;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .ayah-card.active-ayah .ayah-badge {
      background: #fde68a;
      color: #92400e;
    }

    /* Teks Arab */
    .ayah-arabic {
      direction: rtl;
      font-size: 2.2rem;
      line-height: 2.5;
      text-align: right;
      font-family: 'Amiri', 'Traditional Arabic', serif;
      word-spacing: 6px;
      color: #0f172a;
    }

    .word {
      display: inline-block;
      padding: 0 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease-in-out;
      user-select: none;
    }

    .word:hover {
      background: rgba(245, 158, 11, 0.12);
    }

    /* Sorotan saat audio berbunyi */
    .word.is-playing {
      background-color: var(--active-word-bg);
      outline: 2px solid var(--active-word-border);
      color: #92400e !important;
      font-weight: 700;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 3px 10px rgba(217, 119, 6, 0.25);
    }

    .ayah-translation {
      margin-top: 1rem;
      font-size: 0.96rem;
      line-height: 1.65;
      color: #334155;
    }

    .loading-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Floating Player Bawah */
    .sticky-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: center;
      z-index: 100;
      box-shadow: 0 -4px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .player-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .player-info {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      flex: 2;
      height: 38px;
      accent-color: #d97706;
    }
  </style>
</head>
<body>

  <div class="mushaf-container">
    <!-- Header Identitas -->
    <header class="app-header">
      <h1 class="gold-3d-title">Murottal 30 Juz</h1>
      <div class="sub-title">Masjid Al-Ma'hamah, PCGP</div>
    </header>

    <!-- Panel Kontrol Surah & Qari -->
    <div class="controls-panel">
      <div class="form-group">
        <label for="surahSelect">Pilih Surah</label>
        <select id="surahSelect">
          <option value="">Memuat daftar 114 surah...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reciterSelect">Pilih Qari</label>
        <select id="reciterSelect">
          <option value="7">Mishary Rashid Alafasy</option>
          <option value="4">Mahmud Khalil Al-Husary</option>
          <option value="1">Abu Bakr Ash-Shatri</option>
          <option value="5">Hani Ar-Rifai</option>
        </select>
      </div>
    </div>

    <!-- Kontainer Tampilan Ayat -->
    <div id="mushafFeed">
      <div class="loading-state">Menyiapkan mushaf...</div>
    </div>
  </div>

  <!-- Player Sticky Bawah -->
  <div class="sticky-player">
    <div class="player-inner">
      <div class="player-info" id="playerStatus">Menunggu data audio...</div>
      <audio id="globalAudio" controls preload="metadata"></audio>
    </div>
  </div>

  <script>
    let currentAyahsData = [];
    let currentAyahIndex = 0;
    let activeWordEl = null;

    const surahSelect = document.getElementById("surahSelect");
    const reciterSelect = document.getElementById("reciterSelect");
    const mushafFeed = document.getElementById("mushafFeed");
    const audio = document.getElementById("globalAudio");
    const playerStatus = document.getElementById("playerStatus");

    // 1. Ambil Daftar 114 Surah
    async function initSurahList() {
      try {
        const res = await fetch("https://api.quran.com/api/v4/chapters?language=id");
        if (!res.ok) throw new Error("Gagal mengambil daftar surah");
        
        const data = await res.json();
        if (!data.chapters || !Array.isArray(data.chapters)) return;

        surahSelect.innerHTML = "";
        data.chapters.forEach(ch => {
          const opt = document.createElement("option");
          opt.value = ch.id;
          opt.textContent = `${ch.id}. ${ch.name_simple} (${ch.translated_name.name}) - ${ch.verses_count} Ayat`;
          surahSelect.appendChild(opt);
        });

        loadSurah(1);
      } catch (err) {
        surahSelect.innerHTML = '<option value="">Gagal memuat daftar surah</option>';
        console.error(err);
      }
    }

    // 2. Mengambil Semua Ayat (Pagination Handling)
    async function fetchAllVerses(chapterId) {
      let page = 1;
      let totalPages = 1;
      let allVerses = [];

      while (page <= totalPages) {
        const url = `https://api.quran.com/api/v4/verses/by_chapter/${chapterId}?language=id&words=true&word_fields=text_uthmani&translations=33&per_page=50&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Gagal mengambil teks ayat");

        const data = await res.json();
        allVerses = allVerses.concat(data.verses || []);
        totalPages = data.pagination?.total_pages || 1;
        page++;
      }

      return allVerses;
    }

    // 3. Mengambil Data Audio Sesuai Qari yang Dipilih
    async function fetchAllAudioFiles(chapterId, reciterId) {
      let page = 1;
      let totalPages = 1;
      let allAudioFiles = [];

      while (page <= totalPages) {
        const url = `https://api.quran.com/api/v4/recitations/${reciterId}/by_chapter/${chapterId}?per_page=50&segments=true&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Gagal mengambil data audio qari");

        const data = await res.json();
        allAudioFiles = allAudioFiles.concat(data.audio_files || []);
        totalPages = data.pagination?.total_pages || 1;
        page++;
      }

      return allAudioFiles;
    }

    // 4. Memuat Data Surah & Audio
    async function loadSurah(chapterId) {
      mushafFeed.innerHTML = '<div class="loading-state">Memuat ayat dan segmen audio qari...</div>';
      audio.pause();
      clearHighlight();

      const selectedReciterId = reciterSelect.value || "7";

      try {
        const [rawVerses, rawAudioFiles] = await Promise.all([
          fetchAllVerses(chapterId),
          fetchAllAudioFiles(chapterId, selectedReciterId)
        ]);

        currentAyahsData = rawVerses.map(v => {
          const audioItem = rawAudioFiles.find(a => a.verse_key === v.verse_key);
          
          return {
            verseKey: v.verse_key,
            verseNumber: v.verse_number,
            translation: v.translations?.[0]?.text?.replace(/<sup.*?<\/sup>/g, "") || "",
            words: (v.words || []).map(w => ({
              id: w.position,
              text: w.text_uthmani || w.text || ""
            })),
            audioUrl: audioItem?.url ? `https://verses.quran.com/${audioItem.url}` : "",
            segments: audioItem?.segments || []
          };
        });

        renderMushaf(currentAyahsData);
        loadAndPlayAyah(0, false, 0, false);
      } catch (err) {
        mushafFeed.innerHTML = `<div class="loading-state" style="color:#ef4444;">Terjadi kesalahan: ${err.message}</div>`;
      }
    }

    // 5. Render ke DOM
    function renderMushaf(ayahs) {
      mushafFeed.innerHTML = "";
      const fragment = document.createDocumentFragment();

      ayahs.forEach((ayah, aIdx) => {
        const card = document.createElement("div");
        card.className = "ayah-card";
        card.id = `card-ayah-${aIdx}`;

        const header = document.createElement("div");
        header.className = "ayah-header";
        header.innerHTML = `<span>QS. ${ayah.verseKey}</span><span class="ayah-badge">Ayat ${ayah.verseNumber}</span>`;

        const arabicP = document.createElement("div");
        arabicP.className = "ayah-arabic";

        ayah.words.forEach(w => {
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordId = w.id;
          span.textContent = w.text;

          span.addEventListener("click", () => {
            playSpecificAyahAndWord(aIdx, w.id);
          });

          arabicP.appendChild(span);
          arabicP.appendChild(document.createTextNode(" "));
        });

        const transP = document.createElement("div");
        transP.className = "ayah-translation";
        transP.innerHTML = ayah.translation;

        card.appendChild(header);
        card.appendChild(arabicP);
        card.appendChild(transP);
        fragment.appendChild(card);
      });

      mushafFeed.appendChild(fragment);
    }

    // 6. Audio Controller + Auto Scroll Halus
    function loadAndPlayAyah(index, autoPlay = true, startOffsetSec = 0, shouldScroll = true) {
      if (!currentAyahsData[index]) return;

      currentAyahIndex = index;
      const currentAyah = currentAyahsData[currentAyahIndex];

      document.querySelectorAll(".ayah-card").forEach(c => c.classList.remove("active-ayah"));
      const currentCard = document.getElementById(`card-ayah-${currentAyahIndex}`);
      
      if (currentCard) {
        currentCard.classList.add("active-ayah");

        if (shouldScroll) {
          currentCard.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });
        }
      }

      playerStatus.textContent = `Memutar QS. ${currentAyah.verseKey}`;
      audio.src = currentAyah.audioUrl;

      audio.onloadedmetadata = () => {
        if (startOffsetSec > 0) {
          audio.currentTime = startOffsetSec;
        }
        if (autoPlay) {
          audio.play().catch(() => {});
        }
      };
    }

    function playSpecificAyahAndWord(ayahIdx, wordId) {
      const ayah = currentAyahsData[ayahIdx];
      const segment = ayah.segments.find(s => s[0] === wordId);
      const startMs = segment ? segment[1] : 0;

      if (currentAyahIndex !== ayahIdx || audio.src !== ayah.audioUrl) {
        loadAndPlayAyah(ayahIdx, true, startMs / 1000, true);
      } else {
        audio.currentTime = startMs / 1000;
        audio.play();
      }
    }

    function clearHighlight() {
      if (activeWordEl) {
        activeWordEl.classList.remove("is-playing");
        activeWordEl = null;
      }
    }

    // 7. Sinkronisasi Real-Time Sorotan Kata
    audio.addEventListener("timeupdate", () => {
      const currentMs = audio.currentTime * 1000;
      const activeAyah = currentAyahsData[currentAyahIndex];
      if (!activeAyah) return;

      const activeSegment = activeAyah.segments.find(
        seg => currentMs >= seg[1] && currentMs < seg[2]
      );

      if (activeSegment) {
        const wordId = activeSegment[0];
        if (activeWordEl && activeWordEl.dataset.wordId === String(wordId)) {
          return;
        }

        clearHighlight();

        const card = document.getElementById(`card-ayah-${currentAyahIndex}`);
        if (card) {
          const targetWord = card.querySelector(`[data-word-id="${wordId}"]`);
          if (targetWord) {
            targetWord.classList.add("is-playing");
            activeWordEl = targetWord;
          }
        }
      } else {
        clearHighlight();
      }
    });

    audio.addEventListener("ended", () => {
      clearHighlight();
      if (currentAyahIndex + 1 < currentAyahsData.length) {
        loadAndPlayAyah(currentAyahIndex + 1, true, 0, true);
      } else {
        playerStatus.textContent = "Surah selesai.";
      }
    });

    // Event Listener Ganti Surah & Qari
    surahSelect.addEventListener("change", (e) => {
      if (e.target.value) {
        loadSurah(e.target.value);
      }
    });

    reciterSelect.addEventListener("change", () => {
      if (surahSelect.value) {
        loadSurah(surahSelect.value);
      }
    });

    // Inisialisasi awal
    initSurahList();
  </script>
</body>
</html>
